name: offline_home
description: "Offline LAN + voice control for smart plugs and bulbs. Not affiliated with any vendor."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  bonsoir: ^7.1.5
  crypto: ^3.0.7
  drift: ^2.35.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_tts: ^4.2.5
  freezed_annotation: ^3.1.0
  home_widget: ^0.10.0
  json_annotation: ^4.12.0
  network_info_plus: ^8.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  pointycastle: ^4.0.0
  speech_to_text: ^7.5.0
  sqlite3: ^3.6.0
  yaml: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  drift_dev: ^2.35.0

flutter:
  uses-material-design: true
