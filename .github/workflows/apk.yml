name: APK

# Builds the release APK for sideloading on the owner's phone and publishes it as the
# "apk-latest" pre-release (download straight from the phone's browser).
# Runs only when started by hand or on the working branch; never on main.
on:
  workflow_dispatch:
  push:
    branches: [claude/sweet-thompson-fba2km]

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - name: Build release APK
        run: make apk
      - uses: actions/upload-artifact@v4
        with:
          name: offline-home-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - name: Publish apk-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk offline-home.apk
          notes="Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Sideload on Android (allow install from unknown sources). Not for distribution."
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest offline-home.apk --clobber
            gh release edit apk-latest --notes "$notes" --target "$GITHUB_SHA"
          else
            gh release create apk-latest offline-home.apk --prerelease --title "Offline Home (test APK)" --notes "$notes" --target "$GITHUB_SHA"
          fi
