name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Simulator-backed Flutter tests (test/sim, tag "sim") start sim/run.py.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sim/requirements-dev.txt
      - run: python -m pip install -r sim/requirements-dev.txt
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - name: Generated code up to date
        run: make codegen-check
      - name: Format check
        run: make fmt-check
      - name: Analyze
        run: make analyze
      - name: Test
        run: make flutter-test

  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sim/requirements-dev.txt
      - run: python -m pip install -r sim/requirements-dev.txt
      - name: Simulator tests
        run: make sim-test PYTHON=python
